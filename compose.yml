services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rwanda-news
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app-data
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL}}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "127.0.0.1:31001:3000"
    volumes:
      - /var/lib/web-manager/site-data/rwanda-news:/app-data
      - /var/lib/web-manager/site-uploads/rwanda-news:/app/public/uploads
